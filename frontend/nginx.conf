server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Staging subsite — SPA fallback
    location /staging {
        alias /usr/share/nginx/html;
        try_files $uri $uri/ /staging/index.html;
    }

    # Root path — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
