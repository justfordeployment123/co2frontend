version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: strongpassword123
      POSTGRES_DB: calculateco2
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  backend:
    build: ./backend
    container_name: backend_api
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    ports:
      - "5001:5000"
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://api.calculateco2.eu/api
    container_name: frontend_app
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: always

volumes:
  pgdata: